<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gruppegenerer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 20px;
        }
        ul {
            list-style-type: none;
            padding: 0;
        }
        li {
            margin: 5px 0;
            padding: 10px;
            background-color: #f0f0f0;
            border: 1px solid #ddd;
            border-radius: 4px;
            display: flex;
            align-items: center;
            cursor: pointer;
        }
        li.selected {
            background-color: #007bff;
            color: white;
        }
        li input[type="checkbox"] {
            display: none;
        }
        .bottom-bar {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            background-color: #007bff;
            color: white;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 10px;
            box-shadow: 0 -2px 5px rgba(0, 0, 0, 0.1);
        }
        .bottom-bar button {
            background-color: #0056b3;
            color: white;
            border: none;
            border-radius: 5px;
            padding: 10px 20px;
            cursor: pointer;
        }
        .bottom-bar button:hover {
            background-color: #003d80;
        }
        .group {
            margin-top: 20px;
        }
        .group-item {
            background-color: #d1ecf1;
            padding: 8px;
            margin-bottom: 10px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <h1>Norconsult Grålum - Gruppegenerer</h1>
    <h4>Velg deltakere</h4>
    <input type="text" id="searchBar" placeholder="Søk etter navn..." onkeyup="filterNames()">
    <ul id="nameList"></ul>
    <div id="groupsContainer" class="group"></div>
    <div class="bottom-bar">
        <span id="counter">Valgte: 0</span>
        <button onclick="generateGroups()">Lag grupper</button>
    </div>
    <!-- External JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
